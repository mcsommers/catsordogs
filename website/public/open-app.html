<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in the app | Cats or Dogs?</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0b0c;
        color: #fff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        color: #c8c8cc;
      }
      a.btn {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        background: #ff6b35;
        color: #0b0b0c;
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Open in the app</h1>
      <p id="lead">Open Cats or Dogs? to continue.</p>
      <p id="settings-note" class="hint" hidden></p>
      <a class="btn" id="open-app" href="#">Open in the app</a>
      <p class="hint">If nothing happens, install Cats or Dogs? from the App Store or Google Play, then try again.</p>
      <p id="desktop-hint" class="hint" hidden></p>
    </main>
    <script>
      function normalizePath(pathname) {
        const path = pathname.replace(/\/$/, '') || '/';
        return path;
      }

      function unsubscribeLead(type) {
        const labels = {
          daily_question: 'Daily question',
          matches: 'Matches',
          messages: 'Messages',
          nudges: 'Nudges',
        };
        if (type === 'all') {
          return 'You are unsubscribed from all Cats or Dogs? notification emails.';
        }
        if (labels[type]) {
          return 'You are unsubscribed from Cats or Dogs? emails regarding ' + labels[type] + '.';
        }
        return 'You are unsubscribed from these Cats or Dogs? emails.';
      }

      function resolveAppPath() {
        const fromQuery = new URLSearchParams(window.location.search).get('path');
        if (fromQuery && fromQuery.startsWith('/')) return fromQuery;

        const path = normalizePath(window.location.pathname);
        if (path === '/email-unsubscribed') return '/notifications';

        if (
          path.startsWith('/user/') ||
          path.startsWith('/chat/') ||
          path === '/question' ||
          path === '/matches' ||
          path === '/notifications' ||
          path === '/auth-callback'
        ) {
          return path;
        }

        const deep = window.location.href.match(/\/(user|chat)\/[0-9a-f-]{36}/i);
        if (deep) return deep[0];

        return null;
      }

      const pagePath = normalizePath(window.location.pathname);
      const appPath = resolveAppPath();
      if (!appPath) {
        document.getElementById('lead').textContent =
          'This link could not be read. Open Cats or Dogs? and check Matches.';
        const broken = document.getElementById('open-app');
        broken.textContent = 'Open Cats or Dogs?';
        broken.href = 'https://apps.apple.com/app/id6824766057';
        broken.removeAttribute('id');
      } else {
        const schemePath = appPath.replace(/^\//, '');
        const search = window.location.search || '';
        const appUrl = 'catsordogs://' + schemePath + search;
        const httpsUrl = window.location.origin + appPath + search;
        const androidIntent =
          'intent://' +
          window.location.host +
          appPath +
          search +
          '#Intent;scheme=https;package=net.catsordogs.app;end';
        const link = document.getElementById('open-app');

        if (appPath.startsWith('/chat/')) {
          document.getElementById('title').textContent = 'Chat';
          document.getElementById('lead').textContent =
            'Open Cats or Dogs? to read and reply in this conversation.';
        } else if (appPath.startsWith('/user/')) {
          document.getElementById('title').textContent = 'Profile';
          document.getElementById('lead').textContent =
            'Open Cats or Dogs? to view this profile and respond to a match request.';
        } else if (appPath === '/auth-callback') {
          document.getElementById('title').textContent = 'Confirm your email';
          document.getElementById('lead').textContent =
            'Open Cats or Dogs? to finish signing up or reset your password.';
        } else if (appPath === '/notifications') {
          if (pagePath === '/email-unsubscribed') {
            document.title = 'Unsubscribed | Cats or Dogs?';
            document.getElementById('title').textContent = 'Unsubscribed';
            const rawType = new URLSearchParams(window.location.search).get('type') || '';
            const allowed = ['daily_question', 'matches', 'messages', 'nudges', 'all'];
            const type = allowed.includes(rawType) ? rawType : '';
            document.getElementById('lead').textContent = unsubscribeLead(type);
            const note = document.getElementById('settings-note');
            note.hidden = false;
            note.textContent =
              "You can change this any time in the app's notification settings.";
            const desktop = document.getElementById('desktop-hint');
            desktop.hidden = false;
            desktop.textContent =
              'On a computer? Open the button below on the phone where you use the app, or install Cats or Dogs? on your phone, sign in, and tap Open notification settings.';
            link.textContent = 'Open notification settings';
          } else {
            document.getElementById('title').textContent = 'Notification settings';
            document.getElementById('lead').textContent =
              'Open Cats or Dogs? to manage push and email notifications.';
          }
        }

        const isAndroid = /Android/i.test(navigator.userAgent);
        link.href = isAndroid ? androidIntent : appUrl;

        const openApp = () => {
          if (isAndroid) {
            window.location.href = androidIntent;
            return;
          }
          window.location.href = appUrl;
        };
        link.addEventListener('click', (e) => {
          e.preventDefault();
          openApp();
        });
        if (pagePath !== '/email-unsubscribed') {
          openApp();
        }
      }
    </script>
  </body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open in the app | Cats or Dogs?</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        background: #0b0b0c;
        color: #fff;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
      }
      main {
        max-width: 28rem;
        text-align: center;
      }
      h1 {
        font-size: 1.5rem;
        margin: 0 0 0.75rem;
      }
      p {
        margin: 0 0 1.5rem;
        line-height: 1.5;
        color: #c8c8cc;
      }
      a.btn {
        display: inline-block;
        padding: 0.85rem 1.25rem;
        border-radius: 999px;
        background: #ff6b35;
        color: #0b0b0c;
        font-weight: 600;
        text-decoration: none;
      }
      .hint {
        margin-top: 1rem;
        font-size: 0.875rem;
        color: #888;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="title">Open in the app</h1>
      <p id="lead">Open Cats or Dogs? to continue.</p>
      <a class="btn" id="open-app" href="#">Open in the app</a>
      <p class="hint">If nothing happens, install Cats or Dogs? from the App Store, then try again.</p>
    </main>
    <script>
      const appPath = window.location.pathname;
      const schemePath = appPath.replace(/^\//, '');
      const appUrl = 'catsordogs://' + schemePath;
      const httpsUrl = window.location.origin + appPath;
      const androidIntent =
        'intent://' + window.location.host + appPath + '#Intent;scheme=https;package=net.catsordogs.app;end';

      if (appPath.startsWith('/chat/')) {
        document.getElementById('title').textContent = 'Chat';
        document.getElementById('lead').textContent =
          'Open Cats or Dogs? to read and reply in this conversation.';
      } else if (appPath.startsWith('/user/')) {
        document.getElementById('title').textContent = 'Profile';
        document.getElementById('lead').textContent =
          'Open Cats or Dogs? to view this profile and respond to a match request.';
      }

      const link = document.getElementById('open-app');
      link.href = httpsUrl;

      const isAndroid = /Android/i.test(navigator.userAgent);
      const openApp = () => {
        if (isAndroid) {
          window.location.href = androidIntent;
          return;
        }
        window.location.href = appUrl;
        window.setTimeout(() => {
          window.location.href = httpsUrl;
        }, 1200);
      };
      link.addEventListener('click', (e) => {
        e.preventDefault();
        openApp();
      });
      openApp();
    </script>
  </body>
</html>
